<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Loker — PURBALINK</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#093A8A">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --teal-900:#093A8A;--teal-700:#0B5ED7;--teal-600:#1D6FE8;--teal-50:#EEF5FF;
  --red-800:#B80F24;--red-50:#FFF0F3;
  --ink:#101828;--ink-2:#5B6574;--line:#DCE6F5;--paper:#ffffff;--bg:#F5F8FC;--amber:#e0900c;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;overscroll-behavior-x:none;max-width:100vw;}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:64px;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px;}

/* header */
header.site{background:var(--teal-900);color:#fff;padding:16px 0 18px;}
.header-row{display:flex;align-items:center;gap:12px;}
.logo{display:flex;align-items:center;gap:9px;}
.mark{width:32px;height:32px;border-radius:8px;background:var(--red-800);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0;}
.word{font-size:16px;font-weight:800;letter-spacing:-.3px;}
.page-title{font-size:19px;font-weight:800;margin:14px 0 4px;}
.page-sub{font-size:12.5px;color:#CFE0FA;}
.search-bar{display:flex;gap:8px;margin-top:14px;}
.search-bar input{flex:1;height:44px;border-radius:10px;border:none;padding:0 14px;font-size:13.5px;outline:none;}
.search-bar button{height:44px;padding:0 18px;border-radius:10px;background:var(--red-800);color:#fff;border:none;font-weight:700;font-size:13px;}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;background:var(--paper);border-bottom:1px solid var(--line);}
.chip{flex-shrink:0;font-size:12.5px;font-weight:700;padding:8px 15px;border-radius:20px;background:var(--teal-50);color:var(--teal-700);border:1px solid transparent;white-space:nowrap;}
.chip.active{background:var(--teal-700);color:#fff;}

main{padding:16px 0 20px;}
.result-count{font-size:12.5px;color:var(--ink-2);margin-bottom:12px;padding:0 16px;}
.job-list{display:flex;flex-direction:column;gap:12px;padding:0 16px;}

.job-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:box-shadow .15s;}
.job-card:hover{box-shadow:0 6px 18px rgba(9,58,138,.08);}
.job-top{display:flex;gap:12px;}
.job-logo{width:46px;height:46px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;}
.job-info{flex:1;min-width:0;}
.job-title{font-size:14.5px;font-weight:800;line-height:1.3;margin-bottom:3px;}
.job-company{font-size:12.5px;color:var(--ink-2);font-weight:600;}
.job-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.meta-tag{font-size:11px;font-weight:700;color:var(--ink-2);background:var(--bg);padding:4px 9px;border-radius:6px;display:flex;align-items:center;gap:4px;}
.job-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.job-salary{font-size:13px;font-weight:800;color:var(--teal-700);}
.job-time{font-size:11px;color:var(--ink-2);}
.badge-new{background:var(--red-800);color:#fff;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:middle;}

/* detail view */
#detailView{display:none;}
.back-link{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--teal-700);padding:14px 16px 0;}
.jd-wrap{max-width:760px;margin:0 auto;padding:0 16px;}
.jd-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 22px 8px;margin-top:14px;}
.jd-top{display:flex;gap:14px;align-items:flex-start;}
.jd-logo{width:58px;height:58px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;}
.jd-title{font-size:19px;font-weight:800;line-height:1.3;}
.jd-company{font-size:13.5px;color:var(--ink-2);font-weight:700;margin-top:3px;}
.jd-meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;}
.jd-actions{display:flex;gap:10px;margin:18px 0;}
.btn-apply{flex:1;background:var(--red-800);color:#fff;border:none;border-radius:10px;height:46px;font-weight:800;font-size:14px;}
.btn-apply.applied{background:var(--teal-700);}
.btn-save{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:18px;}
.btn-save.saved{border-color:var(--red-800);color:var(--red-800);}
.jd-section{border-top:1px solid var(--line);padding:18px 0;}
.jd-section h3{font-size:14px;font-weight:800;margin:0 0 10px;}
.jd-section p, .jd-section li{font-size:13.5px;line-height:1.7;color:#334155;}
.jd-section ul{margin:0;padding-left:18px;}
.company-box{display:flex;gap:12px;align-items:center;background:var(--teal-50);border-radius:12px;padding:14px 16px;margin:16px 0;}
.company-box .jd-logo{width:44px;height:44px;font-size:15px;}

@media(min-width:760px){
  .job-list{display:grid;grid-template-columns:1fr 1fr;}
}

/* ===== PURBALINK 2026 BRAND SYSTEM — visual only, feature logic unchanged ===== */
.brand-purba{color:#0B5ED7}.brand-link{color:#E3062C}
.mark{background-color:transparent!important;background-image:url("brand-icon-transparent.png")!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important;color:transparent!important;overflow:hidden!important}
.logo .word,.pword{letter-spacing:-.55px}
</style>
<link rel="stylesheet" href="v2.css">
</head>
<body>

<!-- ============ LIST VIEW ============ -->
<div id="listView">
<header class="site">
  <div class="wrap">
    <div class="header-row">
      <a class="logo" href="index.html"><div class="mark">P</div><div class="word"><span class="brand-purba">PURBA</span><span class="brand-link">LINK</span></div></a>
    </div>
    <div class="page-title">Loker Purbalingga</div>
    <div class="page-sub">1.240+ lowongan aktif dari perusahaan terpercaya</div>
    <div class="search-bar">
      <input type="text" placeholder="Cari posisi, perusahaan, atau kata kunci...">
      <button>Cari</button>
    </div>
  </div>
</header>

<div class="filters">
  <span class="chip active">Semua</span>
  <span class="chip">Terdekat</span>
  <span class="chip">Full Time</span>
  <span class="chip">Part Time</span>
  <span class="chip">Magang</span>
  <span class="chip">WFH</span>
  <span class="chip">Gaji Tertinggi</span>
</div>

<main class="wrap" style="padding-left:0;padding-right:0;">
  <div class="result-count" id="resultCount"></div>
  <div class="job-list" id="jobList"></div>
</main>
</div>

<!-- ============ DETAIL VIEW ============ -->
<div id="detailView">
  <header class="site">
    <div class="wrap header-row"><a class="logo" href="index.html"><div class="mark">P</div><div class="word"><span class="brand-purba">PURBA</span><span class="brand-link">LINK</span></div></a></div>
  </header>
  <a class="back-link" href="#" onclick="showList();return false;">← Kembali ke Daftar Loker</a>
  <div class="jd-wrap">
    <div class="jd-card" id="jdCard"></div>
  </div>
  <div style="height:30px;"></div>
</div>

<nav class="bottomnav"></nav>

<style>
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -3px 14px rgba(9,58,138,.08);}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;color:var(--ink-2);}
.bn-ic{width:22px;height:22px;}
.bn-label{font-size:10.5px;font-weight:700;}
.bn-item.active{color:var(--teal-700);}
</style>

<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(()=>{}); }

document.querySelector("nav.bottomnav").innerHTML = `
  <a href="index.html" class="bn-item">
    <svg class="bn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h12a1 1 0 001-1V10"/></svg>
    <span class="bn-label">Beranda</span>
  </a>
  <a href="loker.html" class="bn-item active">
    <svg class="bn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
    <span class="bn-label">Loker</span>
  </a>
  <a href="shop.html" class="bn-item">
    <svg class="bn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    <span class="bn-label">Shop</span>
  </a>
  <a href="video.html" class="bn-item">
    <svg class="bn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="18" rx="3"/><path d="M17 8l4-2v12l-4-2z"/></svg>
    <span class="bn-label">Video</span>
  </a>
  <a href="profile.html" class="bn-item">
    <svg class="bn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
    <span class="bn-label">Profile</span>
  </a>`;

const jobs = [
  {id:1,title:"Staff Admin Gudang",company:"CV Sumber Makmur",loc:"Purbalingga Kota",type:"Full Time",salary:"Rp2,8 – 3,5 Jt",posted:"Baru",color:"#0B5ED7",
    desc:"Mengelola stok dan administrasi gudang, input data harian, dan koordinasi dengan tim logistik.",
    req:["Min. SMA/SMK sederajat","Terbiasa menggunakan Excel","Teliti dan disiplin","Domisili Purbalingga & sekitarnya"],
    about:"CV Sumber Makmur adalah distributor sembako yang telah beroperasi lebih dari 15 tahun di Purbalingga."},
  {id:2,title:"Marketing Online (Live & Konten)",company:"Raihaana Kids Store",loc:"Kalimanah, Purbalingga",type:"Full Time",salary:"Rp3,0 – 4,2 Jt",posted:"2 hari lalu",color:"#B80F24",
    desc:"Mengelola konten media sosial, live selling, dan strategi promosi produk online.",
    req:["Aktif media sosial (TikTok/Instagram)","Kreatif membuat konten","Pengalaman live selling nilai plus","Bisa kerja target"],
    about:"Toko online perlengkapan anak yang berkembang pesat di Purbalingga."},
  {id:3,title:"Operator Produksi",company:"PT Rambang Multi Industri",loc:"Bukateja, Purbalingga",type:"Full Time",salary:"Rp2,5 – 3,0 Jt",posted:"3 hari lalu",color:"#0B5ED7",
    desc:"Menjalankan mesin produksi sesuai SOP dan menjaga kualitas hasil produksi.",
    req:["Min. SMA/SMK sederajat","Sehat jasmani & rohani","Bersedia kerja shift","Pengalaman pabrik nilai plus"],
    about:"Perusahaan manufaktur rambut/wig yang menjadi salah satu penyerap tenaga kerja terbesar di Purbalingga."},
  {id:4,title:"Kasir & Pelayan Toko",company:"Mitra Swalayan",loc:"Purbalingga Kota",type:"Part Time",salary:"Rp1,8 – 2,2 Jt",posted:"5 hari lalu",color:"#e0900c",
    desc:"Melayani transaksi kasir dan menjaga kebersihan area toko.",
    req:["Min. SMP/SMA","Ramah dan jujur","Bisa kerja shift sore","Domisili dekat lokasi diutamakan"],
    about:"Jaringan minimarket lokal dengan 6 cabang di Purbalingga dan sekitarnya."},
  {id:5,title:"Graphic Designer (Freelance)",company:"Purbalink Media Group",loc:"Remote / WFH",type:"WFH",salary:"Rp150rb/proyek",posted:"1 minggu lalu",color:"#1D6FE8",
    desc:"Membuat desain grafis untuk kebutuhan konten berita dan media sosial.",
    req:["Menguasai Canva/Photoshop","Portofolio desain","Bisa deadline cepat","Kreatif dan komunikatif"],
    about:"Perusahaan media digital yang mengelola beberapa portal berita lokal."},
  {id:6,title:"Magang Digital Marketing",company:"Koperasi Purbalingga Maju",loc:"Purbalingga Kota",type:"Magang",salary:"Rp800rb + Uang Makan",posted:"1 minggu lalu",color:"#B80F24",
    desc:"Membantu tim pemasaran digital menjalankan kampanye promosi produk koperasi.",
    req:["Mahasiswa aktif/fresh graduate","Familiar media sosial","Mau belajar hal baru","Magang min. 3 bulan"],
    about:"Koperasi serba usaha yang menaungi puluhan UMKM lokal di Purbalingga."},
];

function initials(name){ return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }

function renderList(){
  document.getElementById("resultCount").textContent = `${jobs.length} lowongan ditemukan`;
  document.getElementById("jobList").innerHTML = jobs.map(j=>`
    <div class="job-card" onclick="showDetail(${j.id})">
      <div class="job-top">
        <div class="job-logo" style="background:${j.color};">${initials(j.company)}</div>
        <div class="job-info">
          <div class="job-title">${j.title}${j.posted==="Baru"?'<span class="badge-new">BARU</span>':''}</div>
          <div class="job-company">${j.company} · ${j.loc}</div>
        </div>
      </div>
      <div class="job-meta">
        <span class="meta-tag">💼 ${j.type}</span>
        <span class="meta-tag">📍 ${j.loc}</span>
      </div>
      <div class="job-bottom">
        <span class="job-salary">${j.salary}</span>
        <span class="job-time">${j.posted}</span>
      </div>
    </div>`).join("");
}
renderList();

let savedJobs = new Set();
let appliedJobs = new Set();

function showDetail(id){
  const j = jobs.find(x=>x.id===id);
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").style.display = "block";
  window.scrollTo(0,0);
  document.getElementById("jdCard").innerHTML = `
    <div class="jd-top">
      <div class="jd-logo" style="background:${j.color};">${initials(j.company)}</div>
      <div>
        <div class="jd-title">${j.title}</div>
        <div class="jd-company">${j.company}</div>
      </div>
    </div>
    <div class="jd-meta-row">
      <span class="meta-tag">💼 ${j.type}</span>
      <span class="meta-tag">📍 ${j.loc}</span>
      <span class="meta-tag">💰 ${j.salary}</span>
      <span class="meta-tag">🕒 Diposting ${j.posted}</span>
    </div>
    <div class="jd-actions">
      <button class="btn-apply ${appliedJobs.has(id)?'applied':''}" onclick="applyJob(${id}, this)">${appliedJobs.has(id)?'✓ Lamaran Terkirim':'Lamar Sekarang'}</button>
      <button class="btn-save ${savedJobs.has(id)?'saved':''}" onclick="saveJob(${id}, this)">🔖</button>
    </div>
    <div class="jd-section">
      <h3>Deskripsi Pekerjaan</h3>
      <p>${j.desc}</p>
    </div>
    <div class="jd-section">
      <h3>Kualifikasi</h3>
      <ul>${j.req.map(r=>`<li>${r}</li>`).join("")}</ul>
    </div>
    <div class="jd-section" style="border-bottom:none;">
      <h3>Tentang Perusahaan</h3>
      <div class="company-box">
        <div class="jd-logo" style="background:${j.color};">${initials(j.company)}</div>
        <div>
          <div style="font-weight:800;font-size:13.5px;">${j.company}</div>
          <div style="font-size:12px;color:var(--ink-2);margin-top:2px;">${j.about}</div>
        </div>
      </div>
    </div>`;
}
function showList(){
  document.getElementById("detailView").style.display = "none";
  document.getElementById("listView").style.display = "block";
  window.scrollTo(0,0);
}
function applyJob(id, btn){
  if(appliedJobs.has(id)) return;
  appliedJobs.add(id);
  btn.textContent = "✓ Lamaran Terkirim";
  btn.classList.add("applied");
}
function saveJob(id, btn){
  if(savedJobs.has(id)){ savedJobs.delete(id); btn.classList.remove("saved"); }
  else { savedJobs.add(id); btn.classList.add("saved"); }
}
</script>
<script src="v2.js"></script>
</body>
</html>
