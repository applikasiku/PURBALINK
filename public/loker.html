<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><title>Loker — PURBALINK</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#093A8A"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="v2.css"></head><body>
<div id="listView">
  <section class="job-app-hero">
    <div class="job-app-wrap">
      <div class="job-greeting"><div class="job-user-avatar">P</div><div><small>Selamat datang</small><b>Temukan pekerjaan impianmu</b></div></div>
      <div class="job-search-modern">
        <img src="https://img.icons8.com/ios/50/search--v1.png" alt="">
        <input id="jobKeyword" placeholder="Cari posisi atau perusahaan" value="">
        <input id="jobLocation" type="hidden" value="Purbalingga">
        <button id="jobSearchBtn" type="button">Cari</button>
      </div>
    </div>
  </section>
  <main class="job-feed">
    <div class="job-app-wrap">
      <div class="job-feed-head"><div><h1>Rekomendasi</h1><p>Lowongan terbaru untukmu</p></div><span class="job-live-pill" id="jobSourceNote">Menghubungkan Jooble…</span></div>
      <div class="job-filter-row">
        <button class="job-filter-chip active" data-filter="Semua">Semua</button><button class="job-filter-chip" data-filter="Terbaru">Baru untukmu</button><button class="job-filter-chip" data-filter="Full Time">Full time</button><button class="job-filter-chip" data-filter="Part Time">Part time</button><button class="job-filter-chip" data-filter="Magang">Magang</button><button class="job-filter-chip" data-filter="WFH">Remote</button>
      </div>
      <div class="result-count" id="resultCount">Menyiapkan lowongan…</div>
      <div class="job-list" id="jobList"></div>
    </div>
  </main>
</div>
<div id="detailView" style="display:none"><div class="jd-wrap"><a class="tk-back" href="#" onclick="showList();return false">← Kembali ke hasil pencarian</a><div class="jd-card" id="jdCard"></div></div></div>
<nav class="bottomnav"></nav><script src="v2.js"></script></body></html>
