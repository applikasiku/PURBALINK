<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Video — PURBALINK</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --teal-700:#1D6FE8;--teal-500:#2D7CF1;--red-800:#B80F24;--red-500:#E3062C;
  --paper:#ffffff;
}
*{box-sizing:border-box;}
html{margin:0;padding:0;min-height:100%;overflow-x:hidden;overflow-y:auto;background:#f7f8fb;}body{margin:0;padding:0;min-height:100vh;height:auto;overflow-x:hidden;overflow-y:auto;background:#f7f8fb;-webkit-overflow-scrolling:touch;overscroll-behavior-y:auto;}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{color:inherit;text-decoration:none;}

.topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:center;gap:26px;padding:calc(env(safe-area-inset-top) + 12px) 0 10px;background:linear-gradient(rgba(0,0,0,.5),transparent);}
.topbar span{font-size:14.5px;font-weight:700;opacity:.6;padding-bottom:8px;}
.topbar span.active{opacity:1;border-bottom:2.5px solid #fff;}

.feed{height:100vh;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;}
.feed::-webkit-scrollbar{display:none;}
.item{height:100vh;height:100dvh;scroll-snap-align:start;position:relative;display:flex;align-items:flex-end;background-size:cover;background-position:center;}
.item::after{content:"";position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,.15) 40%, rgba(0,0,0,.35) 100%);}

.item-content{position:relative;z-index:5;width:100%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px calc(env(safe-area-inset-bottom) + 76px);}

.left-info{max-width:76%;}
.uname{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.uname b{font-size:14.5px;font-weight:800;}
.follow-btn{border:1.5px solid #fff;border-radius:6px;padding:2px 10px;font-size:11px;font-weight:800;}
.follow-btn.following{background:rgba(255,255,255,.2);}
.caption{font-size:13.5px;line-height:1.5;margin-bottom:8px;}
.music-row{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.9;}

.right-actions{display:flex;flex-direction:column;align-items:center;gap:19px;flex-shrink:0;padding-left:10px;}
.ract{display:flex;flex-direction:column;align-items:center;gap:4px;}
.ract .ic-circle{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:21px;backdrop-filter:blur(2px);}
.ract .ic-circle.liked{color:var(--red-500);}
.ract span{font-size:11px;font-weight:700;}
.avatar-ring{width:46px;height:46px;border-radius:50%;border:2px solid #fff;background-size:cover;background-position:center;position:relative;margin-bottom:6px;}
.avatar-plus{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:19px;height:19px;border-radius:50%;background:var(--red-500);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}

/* comments sheet */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:none;}
.sheet-backdrop.show{display:block;}
.comment-sheet{position:fixed;left:0;right:0;bottom:0;background:#181818;border-radius:18px 18px 0 0;z-index:90;max-height:65vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s;padding-bottom:env(safe-area-inset-bottom);}
.comment-sheet.show{transform:translateY(0);}
.sheet-head{text-align:center;padding:12px 0 8px;font-size:13.5px;font-weight:700;border-bottom:1px solid #2c2c2c;position:relative;}
.sheet-close{position:absolute;right:14px;top:10px;font-size:20px;opacity:.7;}
.sheet-body{flex:1;overflow-y:auto;padding:12px 16px;}
.sheet-comment{display:flex;gap:10px;margin-bottom:16px;}
.sc-avatar{width:32px;height:32px;border-radius:50%;background:var(--teal-700);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.sc-name{font-size:12px;font-weight:700;opacity:.75;}
.sc-text{font-size:13.5px;margin-top:2px;line-height:1.4;}
.sc-like{font-size:11px;opacity:.6;margin-top:4px;}
.sheet-input{display:flex;gap:10px;padding:10px 14px;border-top:1px solid #2c2c2c;}
.sheet-input input{flex:1;background:#2a2a2a;border:none;border-radius:20px;padding:10px 16px;color:#fff;font-size:13px;outline:none;}
.sheet-input button{color:var(--teal-500);font-weight:800;font-size:13px;padding:0 6px;}

.mute-btn{position:absolute;top:calc(env(safe-area-inset-top) + 54px);right:14px;z-index:10;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:15px;}

nav.bottomnav{background:rgba(10,10,10,.92) !important;border-top:1px solid rgba(255,255,255,.08) !important;}
nav.bottomnav .bn-item{color:rgba(255,255,255,.6) !important;}
nav.bottomnav .bn-item.active{color:#2D7CF1 !important;}

/* ===== PURBALINK 2026 BRAND SYSTEM — visual only, feature logic unchanged ===== */
.brand-purba{color:#0B5ED7}.brand-link{color:#E3062C}
.mark{background-color:transparent!important;background-image:url("brand-icon-transparent.png")!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important;color:transparent!important;overflow:hidden!important}
.logo .word,.pword{letter-spacing:-.55px}
</style>
<link rel="stylesheet" href="v2.css">
</head>
<body class="pv6-video-home">
<header class="pv6-video-header"><a href="index.html"><i class="fa-solid fa-chevron-left"></i></a><b>PURBALINK <span>Video</span></b><button type="button" id="videoSearchBtn"><i class="fa-solid fa-magnifying-glass"></i></button></header>
<div class="pv61-search" id="videoSearch" hidden><i class="fa-solid fa-magnifying-glass"></i><input id="videoSearchInput" type="search" placeholder="Cari video, kreator, topik..."><button type="button" id="videoSearchClose"><i class="fa-solid fa-xmark"></i></button></div>
<div class="pv61-categories" id="videoCategories"><button class="active" data-vcat="Semua">Semua</button><button data-vcat="Berita">Berita</button><button data-vcat="Kuliner">Kuliner</button><button data-vcat="Wisata">Wisata</button><button data-vcat="Karier">Karier</button><button data-vcat="UMKM">UMKM</button></div>
<main class="pv6-video-shell">
  <section class="pv6-video-hero" id="videoHero"></section>
  <section><div class="pv6-vtitle"><h2>Video Terbaru</h2><span>Untuk Kamu</span></div><div class="pv6-video-grid" id="videoLatest"></div></section>
  <section><div class="pv6-vtitle"><h2>Video Trending 🔥</h2><span>Paling ramai</span></div><div class="pv6-video-list" id="videoTrending"></div></section>
  <section><div class="pv6-vtitle"><h2>Video Populer</h2><span>Geser</span></div><div class="pv6-video-carousel" id="videoPopular"></div></section>
  <section><div class="pv6-vtitle"><h2>Rekomendasi</h2><span>Pilihan untuk Anda</span></div><div class="pv6-video-grid" id="videoRecommend"></div></section>
</main>
<div class="pv61-player-backdrop" id="videoPlayerBackdrop" hidden></div><section class="pv61-player" id="videoPlayer" hidden><button class="pv61-player-close" type="button" id="videoPlayerClose"><i class="fa-solid fa-xmark"></i></button><div class="pv61-player-media" id="videoPlayerMedia"></div><div class="pv61-player-info" id="videoPlayerInfo"></div></section>
<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeComments()"></div><div class="comment-sheet" id="commentSheet"><div class="sheet-head"><span id="commentCountLabel">Komentar</span><span class="sheet-close" onclick="closeComments()">✕</span></div><div class="sheet-body" id="commentBody"></div><div class="sheet-input"><input type="text" id="commentInput" placeholder="Tambahkan komentar..."><button onclick="postVideoComment()">Kirim</button></div></div>
<nav class="bottomnav"></nav><script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
const videos = [
  {id:1,user:"kulinerpurbalingga",caption:"Sensasi keripik tempe krispi khas Purbalingga 🔥 wajib coba!",music:"Audio Asli · kulinerpurbalingga",img:"https://images.unsplash.com/photo-1626200419199-391ae4be7a41?w=700&q=80",likes:2840,comments:[
      {name:"Rina S.",text:"Enak banget ini beneran, aku langsung order 😍",likes:24},
      {name:"Dedi P.",text:"Lokasinya dimana kak?",likes:8},
    ]},
  {id:2,user:"purbalink.jobs",caption:"3 tips lolos interview kerja pertama kali! Simak sampai habis 👀",music:"Suara Trending · Podcast Karir",img:"https://images.unsplash.com/photo-1521737604893-d14cc237f11d?w=700&q=80",likes:5310,comments:[
      {name:"Fajar A.","text":"Makasih infonya kak, sangat membantu!",likes:41},
      {name:"Wulan D.",text:"Ada loker admin nggak ya buat fresh graduate?",likes:12},
    ]},
  {id:3,user:"wisata.purbalingga",caption:"Golden sunrise di Purbalingga pagi ini ☀️ siapa yang kangen suasana desa?",music:"Audio Asli · wisata.purbalingga",img:"https://images.unsplash.com/photo-1500534623283-312aade485b7?w=700&q=80",likes:9120,comments:[
      {name:"Bagus T.",text:"Indah banget pemandangannya masyaAllah",likes:56},
    ]},
  {id:4,user:"raihaanakids.store",caption:"Unboxing mainan edukasi kayu terbaru buat si kecil 🧸",music:"Audio Asli · raihaanakids.store",img:"https://images.unsplash.com/photo-1587654780291-39c9404d746b?w=700&q=80",likes:1870,comments:[
      {name:"Mira K.",text:"Lucu banget, aman ga buat balita?",likes:9},
    ]},
  {id:5,user:"purbalink.news",caption:"Update pembangunan jalan lingkar Purbalingga, sudah sejauh mana?",music:"Audio Asli · purbalink.news",img:"https://images.unsplash.com/photo-1541888946425-d81bb19240f5?w=700&q=80",likes:3420,comments:[
      {name:"Anton W.",text:"Semoga cepat selesai, macet terus soalnya",likes:33},
    ]},
];
function fmt(n){return n>=1000?(n/1000).toFixed(1).replace(".0","")+"K":n}
const catOf=v=>/kuliner/i.test(v.user+v.caption)?'Kuliner':/wisata|sunrise|desa/i.test(v.user+v.caption)?'Wisata':/jobs|interview|karir/i.test(v.user+v.caption)?'Karier':/store|unboxing|produk/i.test(v.user+v.caption)?'UMKM':'Berita';
function videoCard(v){return '<article class="pv6-vcard" data-video="'+v.id+'"><div style="background-image:url(\''+v.img+'\')"><i class="fa-solid fa-play"></i></div><h3>'+v.caption+'</h3><span>@'+v.user+' · '+fmt(v.likes)+' suka</span></article>'}
function openVideo(id){const v=videos.find(x=>String(x.id)===String(id));if(!v)return;history.replaceState(null,'','video.html?v='+v.id);document.getElementById('videoPlayerMedia').innerHTML='<div class="pv61-player-poster" style="background-image:url(\''+v.img+'\')"><button type="button"><i class="fa-solid fa-play"></i></button></div>';document.getElementById('videoPlayerInfo').innerHTML='<small>'+catOf(v)+'</small><h2>'+v.caption+'</h2><p>@'+v.user+' · '+fmt(v.likes)+' suka</p><div class="pv61-player-actions"><button onclick="openComments('+v.id+')"><i class="fa-solid fa-comment"></i> '+v.comments.length+'</button><button onclick="navigator.share?navigator.share({title:'+JSON.stringify('PURBALINK Video')+',url:location.href}):navigator.clipboard?.writeText(location.href)"><i class="fa-solid fa-share-nodes"></i> Bagikan</button><button><i class="fa-solid fa-bookmark"></i> Simpan</button></div>';document.getElementById('videoPlayerBackdrop').hidden=false;document.getElementById('videoPlayer').hidden=false;document.documentElement.classList.add('pv61-player-open')}
function renderVideoHome(){const sorted=[...videos].sort((a,b)=>b.likes-a.likes),hero=sorted[0];document.getElementById('videoHero').innerHTML='<div class="pv6-vhero-img" style="background-image:url(\''+hero.img+'\')"></div><div class="pv6-vhero-shade"></div><div class="pv6-vhero-copy"><small>TRENDING SEKARANG</small><h1>'+hero.caption+'</h1><p>@'+hero.user+' · '+fmt(hero.likes)+' suka</p><button onclick="openVideo('+hero.id+')"><i class="fa-solid fa-play"></i> Tonton</button></div>';document.getElementById('videoLatest').innerHTML=videos.slice(0,6).map(videoCard).join('');document.getElementById('videoTrending').innerHTML=sorted.slice(0,5).map((v,i)=>'<article data-video="'+v.id+'"><b>#'+(i+1)+'</b><div class="pv6-vlist-img" style="background-image:url(\''+v.img+'\')"></div><div><small>TRENDING</small><h3>'+v.caption+'</h3><span>'+fmt(v.likes)+' suka · '+v.comments.length+' komentar</span></div><i class="fa-solid fa-chevron-right"></i></article>').join('');document.getElementById('videoPopular').innerHTML=sorted.map(videoCard).join('');document.getElementById('videoRecommend').innerHTML=[...videos].reverse().slice(0,6).map(videoCard).join('');document.querySelectorAll('[data-video]').forEach(x=>x.onclick=()=>openVideo(x.dataset.video))}
let activeVideoId=null;function openComments(id){activeVideoId=id;const v=videos.find(x=>x.id===id);document.getElementById("commentCountLabel").textContent=v.comments.length+" Komentar";renderVideoComments(v);document.getElementById("sheetBackdrop").classList.add("show");document.getElementById("commentSheet").classList.add("show")}function closeComments(){document.getElementById("sheetBackdrop").classList.remove("show");document.getElementById("commentSheet").classList.remove("show")}function renderVideoComments(v){document.getElementById("commentBody").innerHTML=v.comments.map(c=>'<div class="sheet-comment"><div class="sc-avatar">'+c.name.split(" ").map(w=>w[0]).slice(0,2).join("")+'</div><div><div class="sc-name">'+c.name+'</div><div class="sc-text">'+c.text+'</div><div class="sc-like">❤️ '+c.likes+'</div></div></div>').join("")}function postVideoComment(){const input=document.getElementById("commentInput"),text=input.value.trim();if(!text||!activeVideoId)return;const v=videos.find(x=>x.id===activeVideoId);v.comments.push({name:"Anda",text,likes:0});input.value="";renderVideoComments(v)}
renderVideoHome();document.getElementById('videoPlayerClose').onclick=()=>{document.getElementById('videoPlayerBackdrop').hidden=true;document.getElementById('videoPlayer').hidden=true;document.documentElement.classList.remove('pv61-player-open');history.replaceState(null,'','video.html')};document.getElementById('videoPlayerBackdrop').onclick=document.getElementById('videoPlayerClose').onclick;
const searchBox=document.getElementById('videoSearch'),searchInput=document.getElementById('videoSearchInput');document.getElementById('videoSearchBtn').onclick=()=>{searchBox.hidden=false;searchInput.focus()};document.getElementById('videoSearchClose').onclick=()=>{searchBox.hidden=true;searchInput.value='';renderVideoHome()};
function filterVideos(){const q=searchInput.value.trim().toLowerCase(),cat=document.querySelector('[data-vcat].active')?.dataset.vcat||'Semua';const list=videos.filter(v=>(cat==='Semua'||catOf(v)===cat)&&(!q||(v.caption+' '+v.user).toLowerCase().includes(q)));document.getElementById('videoLatest').innerHTML=list.slice(0,6).map(videoCard).join('')||'<p class="pv61-empty">Video tidak ditemukan.</p>';document.getElementById('videoRecommend').innerHTML=[...list].reverse().slice(0,6).map(videoCard).join('');document.querySelectorAll('[data-video]').forEach(x=>x.onclick=()=>openVideo(x.dataset.video))}
searchInput.addEventListener('input',filterVideos);document.querySelectorAll('[data-vcat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-vcat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filterVideos()});
const initialVideo=new URLSearchParams(location.search).get('v');if(initialVideo)setTimeout(()=>openVideo(initialVideo),60);
</script>
<script src="v2.js"></script>
</body>
</html>
